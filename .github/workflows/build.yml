name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Camaras.apk

      # Si falla, deja los errores visibles como anotacion
      - name: Errores
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |What went wrong|Could not|error:" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Compilacion::$msg"


      - uses: actions/upload-artifact@v4
        with:
          name: Camaras.apk
          path: Camaras.apk

      # Publica el APK en la sección "Releases" para bajarlo directo desde el celular
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cámaras v1.0.${{ github.run_number }}
          body: Descargá Camaras.apk e instalalo en Android.
          files: Camaras.apk
          make_latest: true
